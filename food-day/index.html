<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#104b37">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>تحدّي الغذاء الذكي | مدرسة العب الثانوية للبنات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Markazi+Text:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pine:#104b37;--jade:#24805b;--gold:#d9b45c;--ink:#163e2c;--muted:#64806a;--cream:#fffef9;--head:'El Messiri',Tahoma,Arial,sans-serif;--body:'Markazi Text',Georgia,serif}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font-family:var(--head);background:#edf5e9;color:var(--ink)}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}
#app{width:100vw;height:100vh;height:100dvh;overflow:hidden;padding:clamp(5px,1vmin,13px);background:radial-gradient(circle at 0 0,#d9eee0 0,transparent 42%),radial-gradient(circle at 100% 100%,#fff0d0 0,transparent 37%),#f8fbf3}
.view{position:relative;width:min(1560px,100%);height:100%;margin:auto;display:flex;flex-direction:column;min-height:0;overflow:hidden;padding:clamp(10px,1.7vmin,24px);border:1px solid #d9e8d6;border-radius:clamp(15px,2.4vmin,30px);background:rgba(255,255,251,.97);box-shadow:0 18px 50px #1a503023;gap:clamp(8px,1.3vh,16px)}
.view:after{content:'🌿';position:absolute;right:-35px;bottom:-55px;font-size:clamp(140px,20vmin,270px);opacity:.045;pointer-events:none}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:0 0 auto;z-index:2;min-height:35px}.brand{font-weight:700;font-size:clamp(15px,1.6vw,26px)}.tag{border:1px solid #e9d9a5;background:#fff8e5;color:#866326;border-radius:99px;padding:7px 14px;font-size:clamp(12px,1.2vw,20px);font-weight:700;white-space:nowrap}
.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(9px,1.35vh,15px);position:relative;z-index:1}.center{display:flex;flex:1;min-height:0;align-items:center;justify-content:space-evenly;flex-direction:column;text-align:center;gap:10px}.hero-icons{display:flex;gap:clamp(9px,3vw,40px);font-size:clamp(40px,6vw,102px);justify-content:center;filter:drop-shadow(0 10px 8px #25592e24)}.hero-icons span{animation:levitate 3.6s ease-in-out infinite}.hero-icons span:nth-child(2n){animation-delay:-1.6s}@keyframes levitate{50%{transform:translateY(-12px)}}
h1{margin:0;font-size:clamp(37px,5.8vw,95px);line-height:1.2;color:var(--pine)}h1 b{color:#269967}.intro{font:700 clamp(25px,3vw,49px)/1.17 var(--body);margin:0}.muted{color:var(--muted);font-size:clamp(15px,1.5vw,24px);margin:0}.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.btn{padding:clamp(10px,1.5vmin,18px) clamp(17px,2.9vw,45px);background:linear-gradient(125deg,#104b37,#29936c);color:white;border:0;border-radius:17px;box-shadow:0 9px 20px #145b4033;font-size:clamp(15px,1.6vw,25px);font-weight:700}.btn.gold{background:linear-gradient(125deg,#a87930,#dcb65b)}.btn.pale{background:#eff9ed;color:#175b3f;border:1px solid #cce4cf;box-shadow:none}.btn.danger{background:#fff0eb;color:#a0493e;border:1px solid #edc2bb;box-shadow:none}
.join-card{width:min(750px,100%);border:2px solid #d6e7d0;background:linear-gradient(145deg,#f1fff0,#fff8e6);border-radius:27px;padding:clamp(18px,3vmin,42px);display:flex;flex-direction:column;gap:18px;text-align:center}.join-card h2{font-size:clamp(30px,3.2vw,50px);margin:0}.join-card input{width:100%;text-align:center;border:2px solid #bddbc1;border-radius:16px;background:white;padding:13px;font-size:clamp(23px,2.5vw,38px);color:var(--pine)}.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}.chip{background:white;color:#216546;border:1px solid #cde2ca;padding:7px 12px;border-radius:99px;font-size:clamp(13px,1.1vw,17px)}
.classes{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(9px,1.4vw,20px);max-width:1260px}.class-pill{background:white;border:2px solid #d5e7d1;border-radius:99px;padding:clamp(8px,1.2vmin,15px) clamp(15px,2vw,32px);box-shadow:0 8px 18px #255d3315;font-size:clamp(17px,1.9vw,31px);font-weight:700}
.ready-number{font-size:clamp(110px,20vmin,245px);line-height:1;color:#b48a34;font-weight:700;text-shadow:0 10px 22px #cba04c35}.ready-title{font-size:clamp(45px,7vw,100px);line-height:1.25;color:var(--pine);margin:0}.ready-note{font:700 clamp(34px,4vw,66px)/1.12 var(--body);margin:0}
/* يظهر السؤال وحده على السبورة وجوال الصف */
.quiz{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;flex:1;gap:clamp(10px,1.5vh,20px)}.question{background:linear-gradient(125deg,#f0fced,#fffef9 68%,#fff4d9);border:2px solid #d7e9d3;border-radius:clamp(18px,2.2vw,29px);padding:clamp(11px,2.3vmin,28px) 4%;display:flex;align-items:center;justify-content:center;text-align:center;min-height:0;position:relative}.question:before{content:'🌍';position:absolute;top:5%;right:2%;opacity:.58;font-size:clamp(20px,2.6vw,39px)}.question-text{font:700 clamp(38px,4.3vw,82px)/1.07 var(--body);text-wrap:balance;margin:0;max-width:94%}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(8px,1.5vmin,20px);min-height:0}.choice{border:2px solid #ffffff8c;border-radius:clamp(17px,2.1vw,31px);display:flex;align-items:center;gap:clamp(8px,1.4vw,20px);padding:clamp(9px,1.9vmin,25px);width:100%;height:100%;min-height:0;min-width:0;text-align:right;color:white;box-shadow:inset 0 2px #ffffff38,0 9px 25px #1d473225;overflow:hidden}.choice .abc{display:grid;flex:0 0 auto;place-items:center;width:clamp(44px,5vw,74px);height:clamp(44px,5vw,74px);border:2px solid currentColor;border-radius:17px;font-size:clamp(22px,2.4vw,36px)}.choice .label{flex:1;min-width:0;font:700 clamp(35px,3.5vw,67px)/1.07 var(--body);text-wrap:balance}.choice .food{font-size:clamp(25px,3vw,49px);flex:0 0 auto}.choice.berry{background:linear-gradient(125deg,#942044,#d7517a)}.choice.carrot{background:linear-gradient(125deg,#a74312,#e4802a)}.choice.lemon{background:linear-gradient(125deg,#f7dc77,#e6b932);color:#433115}.choice.kiwi{background:linear-gradient(125deg,#0d6249,#2da57a)}.choice.correct{outline:6px solid #20c775;outline-offset:-7px}.choice.selected{outline:5px solid #123f5e;outline-offset:-6px}.choice:disabled{opacity:1}.choice:focus-visible{outline:5px solid #111}
/* عداد حواف الصفحة */
.border-timer{position:absolute;inset:0;z-index:8;pointer-events:none}.border-timer svg{position:absolute;width:100%;height:100%;inset:0}.border-timer path{fill:none;stroke:#d3a548;stroke-width:7;stroke-linecap:round;filter:drop-shadow(0 0 6px #d5a5428c)}.clock-chip{position:absolute;z-index:9;left:clamp(14px,2.3vmin,30px);top:clamp(58px,7vh,85px);background:#fff5da;border:1px solid #d9b45b;border-radius:99px;padding:8px 19px;color:#895c13;font-size:clamp(22px,2.5vw,40px);font-weight:700;box-shadow:0 7px 20px #1a5b3424}.clock-chip.urgent{background:#fff0ed;border-color:#dc8190;color:#a02c48}
/* نتائج السؤال: السرعة والدقة أولاً، ثم التراكمي */
.results{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.5vw,22px);flex:1;min-height:0}.panel{background:linear-gradient(145deg,#f7fff5,#fffdf5);border:2px solid #d7e7d2;border-radius:24px;padding:clamp(10px,1.6vmin,22px);display:flex;flex-direction:column;min-width:0;min-height:0;gap:9px}.panel h2{font-size:clamp(22px,2vw,36px);margin:0;color:var(--pine)}.panel .fact{font:700 clamp(23px,2.5vw,42px)/1.14 var(--body);margin:0;background:#edfaef;border:1px solid #cfe6d0;border-radius:15px;padding:9px 13px;color:#1d6444}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.stat{background:#eaf6e9;border-radius:14px;text-align:center;padding:7px;font-size:clamp(11px,1.1vw,17px);color:#557661}.stat b{display:block;font-size:clamp(21px,2.3vw,37px);color:#185c3e;line-height:1.3}.rank-list{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--cols,1),minmax(0,1fr));grid-template-rows:repeat(var(--rows,1),minmax(0,1fr));grid-auto-flow:column;gap:5px}.rank{display:flex;align-items:center;gap:8px;min-width:0;min-height:0;padding:5px 10px;border:1px solid #d9e6d6;border-radius:12px;background:white}.rank.first{background:#fff4d5;border-color:#dfbc63}.rank.second{background:#f0f5f4}.rank.third{background:#fff0e7}.medal{flex:0 0 32px;text-align:center;font-size:clamp(17px,1.6vw,28px)}.rank-name{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:clamp(15px,1.5vw,25px);font-weight:700}.rank-score{text-align:left;font-size:clamp(13px,1.4vw,23px);font-weight:700;white-space:nowrap}.rank-score small{display:block;color:#637968;font-size:clamp(10px,.9vw,16px)}
/* الختام */
.podium{display:grid;grid-template-columns:1fr 1.18fr 1fr;align-items:end;gap:clamp(8px,1.5vw,24px);width:min(1220px,100%);flex:0 0 40%;min-height:0}.podium-card{height:80%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;border-radius:24px;color:white;text-align:center;padding:12px;box-shadow:0 12px 28px #14412b2b;overflow:hidden}.podium-card.first{height:100%;background:linear-gradient(140deg,#b38025,#e8bd63)}.podium-card.second{background:linear-gradient(140deg,#8b9e9b,#c0ccca)}.podium-card.third{height:72%;background:linear-gradient(140deg,#aa693a,#d69b72)}.podium-card .emoji{font-size:clamp(42px,5vw,89px)}.podium-card .class{font-size:clamp(20px,2.7vw,44px);font-weight:700}.podium-card .pts{font-size:clamp(27px,3.6vw,58px);font-weight:700}.final-list{width:min(1260px,100%);flex:1;min-height:0}.final-title{font-size:clamp(30px,4vw,66px);margin:0;text-align:center;color:var(--pine)}
/* التحكم */
.host-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-height:0}.host-card{background:linear-gradient(145deg,#f3fff1,#fffdf4);border:2px solid #d8e8d3;border-radius:24px;padding:clamp(13px,2vmin,27px);display:flex;flex-direction:column;gap:12px;min-height:0}.host-card h2{font-size:clamp(24px,2.6vw,43px);margin:0}.host-card p{font-size:clamp(17px,1.7vw,27px);line-height:1.5;margin:0}.host-card input{width:100%;direction:ltr;text-align:left;padding:11px;border:1px solid #c5dbcb;border-radius:12px;font:14px monospace;color:#27553d}.hint{font-size:clamp(12px,1.2vw,18px);color:#64806a}.status{font-size:clamp(10px,.9vw,13px);color:#62806c;flex:0 0 auto;text-align:left}.pill-text{font:700 clamp(25px,3vw,48px)/1.1 var(--body);margin:0}
@media(max-width:760px),(max-aspect-ratio:3/4){.view{padding:9px;gap:6px;border-radius:19px}.brand{font-size:clamp(12px,3vw,18px)}.tag{padding:5px 9px;font-size:11px}.quiz{grid-template-rows:auto minmax(0,1fr);gap:7px}.question{padding:8px;max-height:25vh}.question-text{font-size:clamp(31px,8vw,47px)}.choices{grid-template-columns:1fr;grid-template-rows:repeat(4,minmax(0,1fr));gap:clamp(6px,1vh,11px)}.choice{padding:5px 9px;border-radius:18px;gap:8px}.choice .abc{width:clamp(36px,10vw,49px);height:clamp(36px,10vw,49px);font-size:20px;border-radius:12px}.choice .label{font-size:clamp(28px,7.2vw,43px)}.choice .food{font-size:clamp(24px,6.5vw,36px)}.clock-chip{top:55px;font-size:clamp(20px,5vw,29px);padding:5px 11px}.results{grid-template-columns:1fr;grid-template-rows:1fr 1fr;gap:6px}.panel{padding:7px;gap:5px;border-radius:15px}.panel h2{font-size:17px}.panel .fact{font-size:17px;padding:5px}.stat{font-size:9px;padding:3px}.stat b{font-size:17px}.rank{padding:2px 5px;gap:3px}.rank-name{font-size:clamp(10px,3vw,16px)}.rank-score{font-size:clamp(10px,3vw,16px)}.rank-score small{font-size:9px}.medal{flex-basis:20px;font-size:16px}.podium{flex-basis:29%;gap:6px}.podium-card{border-radius:13px;padding:4px}.podium-card .emoji{font-size:29px}.podium-card .class{font-size:clamp(12px,3vw,19px)}.podium-card .pts{font-size:21px}.host-grid{grid-template-columns:1fr;grid-template-rows:1fr 1fr;gap:6px}.host-card{padding:9px;gap:6px}.host-card h2{font-size:20px}.host-card p{font-size:14px}.host-card input{padding:5px}.btn{padding:8px 13px;font-size:clamp(13px,3vw,18px)}.hero-icons{font-size:clamp(33px,8vw,65px)}h1{font-size:clamp(37px,9vw,62px)}}
@media(max-height:670px){.question{max-height:22vh}.question-text{font-size:clamp(27px,5.7vh,48px)}.choice .label{font-size:clamp(26px,5.8vh,43px)}.view{padding:6px;gap:4px}.btn{padding:8px 12px}.ready-number{font-size:clamp(72px,17vh,165px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* أدوات السبورة على نفس الرابط */
.screen-tools{display:flex;align-items:center;justify-content:center;gap:clamp(7px,1.1vw,18px);min-height:65px;flex:0 0 auto;border:1px solid #d5e7d4;background:linear-gradient(110deg,#f1ffed,#fffbef);border-radius:19px;padding:7px 13px;box-shadow:0 6px 15px #1f55300f}
.screen-tools .btn{font-size:clamp(15px,1.45vw,24px);padding:10px clamp(14px,2vw,33px)}
.screen-tools .control-main{min-width:240px;font-weight:700;background:linear-gradient(125deg,#115a3d,#29a476)}
.screen-tools .control-main:disabled{opacity:.55}
.tool-info{margin-inline-start:auto;font-size:clamp(12px,1.1vw,17px);color:#45745b;max-width:240px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tool-icon{border:1px solid #cbdcbe;background:white;color:#22694b;min-height:44px;padding:8px 15px;border-radius:13px;font-size:clamp(13px,1.16vw,19px);font-weight:700}
.tool-icon:focus-visible,.btn:focus-visible{outline:3px solid #cc943d;outline-offset:3px}
.ready-dramatic{font:700 clamp(65px,11vw,166px)/1.1 var(--head);letter-spacing:-1px;color:#0c5137;text-shadow:0 5px 28px #bcca9b7d;animation:appearBig .75s ease both}
@keyframes appearBig{from{opacity:.2;transform:scale(.90)}to{opacity:1;transform:scale(1)}}
.ready-number{font-size:clamp(125px,22vmin,270px)}
.ready-sub{font:700 clamp(24px,3.3vw,54px)/1.14 var(--body);color:#53825f}
.music-overlay{position:absolute;inset:0;z-index:80;display:grid;place-items:center;background:#082c22b8;backdrop-filter:blur(8px);padding:18px}
.music-modal{background:#fffefa;border:2px solid #d5e5cd;border-radius:28px;padding:clamp(18px,3vw,35px);width:min(650px,100%);display:flex;flex-direction:column;gap:15px;box-shadow:0 20px 70px #0004}
.music-modal h2{margin:0;font-size:clamp(23px,2.6vw,36px);color:#0f5038}
.music-modal p{margin:0;font-size:clamp(16px,1.6vw,23px);line-height:1.5}
.music-modal .music-current{background:#ecf8ed;border:1px solid #d1e3d4;border-radius:16px;padding:12px;word-break:break-word;font-size:clamp(15px,1.5vw,21px)}
.music-modal .row{justify-content:space-between}
.music-modal .music-file-button{border:2px dashed #88b79b;border-radius:17px;padding:12px 25px;background:#f4fff2;color:#155b3e;font-size:clamp(16px,1.6vw,24px);text-align:center;cursor:pointer}
.music-modal input[type=range]{width:100%;accent-color:#288963}
.board-live-note{font-size:clamp(13px,1.15vw,17px);color:#446e57}
@media(max-width:760px),(max-aspect-ratio:3/4){.screen-tools{flex-wrap:wrap;padding:6px;min-height:0}.screen-tools .control-main{min-width:140px}.screen-tools .btn,.tool-icon{font-size:13px;padding:7px 10px;min-height:30px}.tool-info{display:none}.ready-dramatic{font-size:clamp(47px,10vw,82px)}.ready-number{font-size:clamp(90px,17vh,140px)}.music-modal{gap:10px}}
@media(max-height:650px){.screen-tools{min-height:43px;padding:3px 7px}.screen-tools .btn,.tool-icon{padding:5px 10px;min-height:30px}.ready-dramatic{font-size:clamp(62px,12vh,104px)}}

/* كشف إجابة السؤال وأسرع المشاركات دون إظهار الترتيب التراكمي إلا في النهاية */
.role-choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.role-option{border:2px solid #c6dfca;border-radius:15px;background:#fff;color:#1e6345;padding:9px 7px;font-weight:700;font-size:clamp(15px,1.35vw,21px)}
.role-option.chosen{border-color:#18a875;background:#e0f7e9;box-shadow:inset 0 0 0 2px #67c89b}
.reveal-stage{flex:1;min-height:0;display:grid;grid-template-rows:auto auto auto auto minmax(0,1fr) auto;gap:clamp(7px,1.2vh,14px)}
.reveal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.reveal-eyebrow{color:#16885b;font-size:clamp(18px,1.8vw,29px);font-weight:700}
.reveal-count{border-radius:99px;padding:5px 15px;background:#fff6db;color:#936c2b;font-size:clamp(16px,1.35vw,23px)}
.reveal-question{display:flex;align-items:center;justify-content:center;text-align:center;font:700 clamp(37px,4.4vw,78px)/1.05 var(--body);background:linear-gradient(115deg,#f4ffef,#fffbe9);border:2px solid #d5e8cf;border-radius:19px;padding:clamp(6px,1.6vh,19px) 12px;max-height:20vh;min-height:0}
.reveal-answer{display:flex;align-items:center;justify-content:center;gap:clamp(14px,3vw,42px);background:linear-gradient(115deg,#075f43,#218c63);border:2px solid #1e9664;color:#fff;border-radius:22px;padding:clamp(8px,1.5vh,19px)}
.reveal-answer span{font-size:clamp(18px,1.8vw,30px);white-space:nowrap}
.reveal-answer strong{font:700 clamp(32px,3.8vw,64px)/1.02 var(--body);text-wrap:balance;text-align:center}
.winners-heading{margin:0;font-size:clamp(20px,2.2vw,34px);color:#146044;text-align:center}
.winners-heading small{font-size:clamp(13px,1.3vw,18px);color:#62816d}
.fast-grid{display:grid;grid-template-columns:repeat(var(--fastcols,1),minmax(0,1fr));grid-template-rows:repeat(var(--fastrows,1),minmax(0,1fr));gap:clamp(6px,1vw,14px);min-height:0;overflow:hidden}
.fast-card{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:clamp(3px,.9vh,11px);background:#fff;border:2px solid #d9e6d8;border-radius:17px;padding:7px;min-height:0;min-width:0;box-shadow:0 6px 16px #1b523013}
.fast-card.fast-first{background:linear-gradient(140deg,#fff3ce,#fffaf1);border-color:#ddb04b}
.fast-rank{font-size:clamp(20px,2.7vw,47px);line-height:1}
.fast-name{font-size:clamp(17px,2vw,34px);line-height:1.2;font-weight:700;overflow-wrap:anywhere}
.fast-time{font-size:clamp(14px,1.5vw,26px);font-weight:700;color:#2a8560}
.no-winners{grid-column:1/-1;display:grid;place-items:center;font:700 clamp(25px,3vw,48px)/1.1 var(--body);border-radius:20px;background:#f2faf1;color:#2f7454}
.reveal-fact{max-height:14vh;overflow:hidden;border:1px solid #c6ddcd;border-radius:14px;background:#f0fbef;color:#32694d;text-align:center;font:700 clamp(20px,2vw,32px)/1.1 var(--body);padding:clamp(6px,.9vh,12px)}
.round-podium-stage{display:flex;flex:1;min-height:0;flex-direction:column;align-items:center;gap:clamp(6px,1.6vh,17px);justify-content:space-evenly;text-align:center}
.round-podium-heading h1{font-size:clamp(36px,5vw,81px);margin:0}

 if(l.phase==='podium')return 'reveal'; // توافق مع الجولات القديمة دون إظهار الترتيب التراكمي
 if(l.phase==='lobby'||l.index<0)return 'lobby';
 const start=Number(state.rounds?.[l.index]?.startedAt);
 if(!start)return 'lobby';
 const e=Date.now()-start;
 return e<READY_MS?'ready':e<READY_MS+QUESTION_MS?'question':'reveal';
};
const index=()=>state.live?.index??-1;
const deadline=()=>Number(state.rounds?.[index()]?.startedAt||0)+READY_MS+QUESTION_MS;
const remaining=(type)=>Math.max(0,Math.ceil(((type==='ready'?deadline()-QUESTION_MS:deadline())-Date.now())/1000));
const validAnswer=(i,id)=>{let a=state.answers?.[i]?.[id],t=Number(state.rounds?.[i]?.startedAt);if(!a||!Number.isInteger(a.choice)||a.choice<0||a.choice>3||!t)return null;return Number(a.at)>=t+READY_MS&&Number(a.at)<=t+READY_MS+QUESTION_MS?a:null};
const elapsed=(i,a)=>Math.max(0,Math.round(Number(a.at)-Number(state.rounds[i].startedAt)-READY_MS));
const completed=()=>stage()==='lobby'?0:stage()==='ready'||stage()==='question'?index():stage()==='final'?Q.length:index()+1;
function totals(){let n=completed();return classList().map(c=>{let pts=0,time=0;for(let i=0;i<n;i++){let a=validAnswer(i,c.id);if(a?.choice===Q[i].ok){pts++;time+=elapsed(i,a)}}return {...c,points:pts,time,pct:n?Math.round(100*pts/n):0}}).sort((a,b)=>b.points-a.points||a.time-b.time||a.name.localeCompare(b.name,'ar'))}
function roundRows(){let i=index();return classList().map(c=>{let a=validAnswer(i,c.id),correct=a?.choice===Q[i].ok;return {...c,answer:a,correct,elapsed:a?elapsed(i,a):null}}).sort((a,b)=>(a.correct?0:a.answer?1:2)-(b.correct?0:b.answer?1:2)||(a.elapsed??99999)-(b.elapsed??99999)||a.name.localeCompare(b.name,'ar'))}
function rankOf(arr,i){if(i===0)return 1;let r=i+1;while(r>1&&arr[r-1].points===arr[r-2].points&&arr[r-1].time===arr[r-2].time)r--;return r}
function mark(n){return n===1?'🥇':n===2?'🥈':n===3?'🥉':String(n)}
function dbURL(path=''){return DB+'/'+ROOM+(path?'/'+path:'')+'.json'}
function localRead(){try{return JSON.parse(localStorage.getItem(KEY))||empty()}catch{return empty()}}
function localSet(path,value,unique){let d=localRead(),ks=path.split('/'),ref=d;for(let i=0;i<ks.length-1;i++)ref=ref[ks[i]]||(ref[ks[i]]={});let k=ks.at(-1);if(unique&&ref[k]!==undefined)throw Error('سُجّلت إجابة الصف بالفعل');if(value===null)delete ref[k];else ref[k]=value;localStorage.setItem(KEY,JSON.stringify(d));state=d;return value}
async function write(path,value,unique=false){if(!REMOTE){let v=localSet(path,value,unique);render();return v}let headers={'Content-Type':'application/json'};if(unique)headers['if-match']='null_etag';let r=await fetch(dbURL(path),{method:'PUT',headers,body:JSON.stringify(value)});if(r.status===412)throw Error('سُجّلت إجابة هذا الصف مسبقًا');if(!r.ok)throw Error('فشل الحفظ: '+r.status);let v=await r.json();await sync();return v}
async function updateRoot(obj){if(REMOTE){let r=await fetch(dbURL(),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)});if(!r.ok)throw Error('فشل التصفير');await sync()}else{let d=localRead();Object.assign(d,obj);localStorage.setItem(KEY,JSON.stringify(d));state=d;render()}}
async function sync(){if(!REMOTE||readBusy)return;readBusy=true;try{let r=await fetch(dbURL()+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let next=await r.json()||empty();if(JSON.stringify(next)!==JSON.stringify(state)){state=next;syncParticipantSession();render()}else{syncParticipantSession()}lastStatus='🟢 متصل بقاعدة البيانات'}catch(e){lastStatus='🔴 مشكلة الاتصال: '+e.message}finally{readBusy=false}}
function urlFor(v){let u=new URL(location.href);u.searchParams.set('view',v);return u.href}
function setView(v){if(v==='host')v='screen';view=v;let u=new URL(location.href);u.searchParams.set('view',v);history.replaceState(null,'',u);render(true)}
const frame=(label,tag,body)=>`<header><div class="brand">🌍 اليوم العالمي للغذاء · ${label}</div><span class="tag">${tag}</span></header><main class="main">${body}</main><div class="status">${REMOTE?'اتصال بين الأجهزة بعد إعداد قاعدة البيانات':'وضع تجريبي داخل المتصفح نفسه'} ${ESC(lastStatus)}</div>`;
function choices(i,interactive=false){const binary=Q[i].a.length===2;return `<div class="choices${binary?' binary-choices':''}">${Q[i].a.map((o,n)=>`<button class="choice ${COLOR[n]}" ${interactive?`data-action="answer" data-choice="${n}"`:'disabled'}><span class="abc">${binary?(n===0?'✓':'✕'):ABC[n]}</span><span class="label">${ESC(o)}</span><span class="food">${binary?'':ICON[n]}</span></button>`).join('')}</div>`}
function questionBody(i,interactive=false){return `<div class="quiz"><div class="question"><h2 class="question-text">${ESC(Q[i].q)}</h2></div>${choices(i,interactive)}</div>${interactive?'':`<div class="clock-chip" id="clockNum">20 ث</div><div class="border-timer" aria-hidden="true"><svg id="timerSvg"><path id="timerPath"/></svg></div>`}`}

function registered(){

function lobby(){return `<div class="center lobby-center"><div class="hero-icons"><span>🥦</span><span>🍎</span><span>🥕</span><span>🌽</span><span>🍋</span></div><h1>المشاركات <b>المسجّلات</b></h1><p class="intro">دوري الصفوف ودوري الكادر المدرسي · ${classList().length} مشاركة</p>${registered()}<p class="muted">استعداد 6 ثوانٍ، ثم 20 ثانية للإجابة على كل سؤال.</p></div>`}
function ready(){return `<div class="center"><div class="hero-icons"><span>🍓</span><span>🥕</span><span>🥦</span></div><h1 class="ready-dramatic">مستعديييييين؟!</h1><div class="ready-number" id="readyNum">${remaining('ready')}</div><p class="ready-sub">السؤال ${index()+1} يبدأ بعد العدّ التنازلي</p></div>`}
function emptyRanks(){return '<div class="muted">بانتظار الإجابات…</div>'}
function rankingList(rows,type='total'){
 const cols=rows.length>10?2:1,lines=Math.max(1,Math.ceil(rows.length/cols));
 return `<div class="rank-list" style="--cols:${cols};--rows:${lines}">${rows.length?rows.map((r,j)=>{let p=type==='total'?rankOf(rows,j):j+1;let secondary=type==='total'?`${r.pct}% · ${r.time?(r.time/1000).toFixed(1)+'ث':'—'}`:r.correct?`${(r.elapsed/1000).toFixed(2)} ثانية`:r.answer?'إجابة خاطئة':'لم يُجب';let primary=type==='total'?`${r.points}/${completed()} نقطة`:r.correct?'صحيحة ✓':r.answer?'خاطئة ✕':'لا إجابة';return `<div class="rank ${p<=3&&(type==='total'||r.correct)?['first','second','third'][p-1]:''}"><span class="medal">${type==='round'&&!r.correct?'—':mark(p)}</span><span class="rank-name">${ESC(r.name)}</span><span class="rank-score">${primary}<small>${secondary}</small></span></div>`}).join(''):emptyRanks()}</div>`
}

function leagueFast(type,heading,icon){
 const all=inLeague(roundRows(),type),correct=all.filter(r=>r.correct);
 const n=correct.length,cols=n>6?3:n>3?2:1,rows=Math.max(1,Math.ceil(n/cols));
 return `<section class="fast-league ${type}"><div class="fast-league-head"><h3>${icon} ${heading}</h3><span>${n} إجابة صحيحة من ${all.length}</span></div>
 <div class="league-fast-grid" style="--cols:${cols};--rows:${rows}">${n?correct.map((r,j)=>`<div class="fast-card ${j===0?'fast-first':''}"><div class="fast-rank">${mark(1+correct.filter(x=>x.elapsed<r.elapsed).length)}</div><div class="fast-name">${ESC(r.name)}</div><div class="fast-time">⚡ ${(r.elapsed/1000).toFixed(2)} ثانية</div></div>`).join(''):'<div class="no-winners">لا توجد إجابة صحيحة لهذه الفئة</div>'}</div></section>`;
}
function revealSlide(){
 const i=index(),q=Q[i],correct=roundRows().filter(r=>r.correct);
 return `<section class="reveal-stage dual-reveal">
 <div class="reveal-head"><span class="reveal-count">السؤال ${i+1} / ${Q.length}</span><span class="reveal-eyebrow">✨ اكتشفنا الحقيقة!</span></div>

 </section>`;
}
function leagueFinal(type,heading,subtitle){
 const all=inLeague(totals(),type);
 const card=(n,cls)=>{const r=all[n];return `<div class="duo-podium-card ${cls}"><span class="duo-medal">${mark(n+1)}</span><strong>${r?ESC(r.name):'—'}</strong><span>${r?`${r.points} / ${Q.length} نقطة`:'لم تُسجّل مشاركة'}</span></div>`};
 const entries=all.length?all.map((r,i)=>`<div class="duo-rank-chip ${i<3?'top-three':''}"><b>${mark(rankOf(all,i))}</b><span>${ESC(r.name)}</span><strong>${r.points}/${Q.length}</strong></div>`).join(''):'<div class="no-final-league">لا توجد مشاركات في هذه الفئة</div>';
 return `<section class="league-final ${type}"><div class="league-final-head"><h2>${heading}</h2><p>${subtitle}</p></div><div class="duo-podium">${card(1,'second')}${card(0,'first')}${card(2,'third')}</div><div class="duo-rank-list">${entries}</div></section>`;
}

 }

}

let musicOpen=false, musicEnabled=localStorage.getItem('foodQuestionSoundEnabled')!=='false';
let musicVolume=Math.min(1,Math.max(0,Number(localStorage.getItem('foodQuestionSoundVolume')??'0.78')));
let musicStatus='🎵 صوت MP4 مدمج مباشرة، دون يوتيوب أو فيديو';
let musicArmedRound=-1,musicActiveRound=-1,musicPending=false;
let previewTimeout=null;
const musicPlayer=new Audio();
musicPlayer.src=EMBEDDED_MUSIC;
musicPlayer.preload='auto';
musicPlayer.loop=false;
musicPlayer.volume=musicVolume;
musicPlayer.addEventListener('error',()=>{musicStatus='تعذّر تشغيل ملف الصوت في هذا المتصفح؛ جرّبي Chrome أو Edge';});
function stopMusic(){
 if(previewTimeout){clearTimeout(previewTimeout);previewTimeout=null}
 musicPlayer.pause();
 try{musicPlayer.currentTime=0}catch(e){}
 musicActiveRound=-1;musicPending=false;
}
function armMusic(i){
 /* يبدأ بصمت لحظة ضغط زر بدء السؤال، تحضيرًا لفتح الصوت بعد 6 ثوانٍ. */
 if(view!=='screen'||!musicEnabled)return;
 if(previewTimeout){clearTimeout(previewTimeout);previewTimeout=null}
 musicArmedRound=i;musicActiveRound=-1;musicPending=true;
 try{
  musicPlayer.pause();musicPlayer.currentTime=0;musicPlayer.volume=0;
  const p=musicPlayer.play();
  if(p?.catch)p.catch(e=>{musicStatus='المتصفح منع بدء الموسيقى؛ جرّبي زر تجربة الصوت قبل بدء السؤال';});
 }catch(e){musicStatus='تعذّر تشغيل الموسيقى: '+e.message}
}
function tickMusic(){
 if(view!=='screen'){
  if(!musicPlayer.paused)stopMusic();
  return;
 }
 const s=stage(),i=index();
 if(s==='question'&&musicArmedRound===i&&musicEnabled){
  if(musicActiveRound!==i){
   musicActiveRound=i;musicPending=false;
   try{
    musicPlayer.currentTime=0;
    musicPlayer.volume=musicVolume;
    if(musicPlayer.paused){
     const p=musicPlayer.play();
     if(p?.catch)p.catch(()=>{musicStatus='شغّلي تجربة الموسيقى مرة واحدة للسماح بالصوت';});
    }
   }catch(e){musicStatus='تعذّر بدء الموسيقى: '+e.message}
  }
 }else if(!(musicPending&&(s==='lobby'||(s==='ready'&&i===musicArmedRound)))){
  if(!musicPlayer.paused)stopMusic();
 }
}
function previewMusic(){
 if(view!=='screen')return;
 if(previewTimeout){clearTimeout(previewTimeout)}
 musicPlayer.pause();
 try{musicPlayer.currentTime=0}catch(e){}
 musicPlayer.volume=musicVolume;
 const p=musicPlayer.play();
 if(p?.catch)p.catch(e=>{musicStatus='لم يسمح المتصفح بتشغيل الموسيقى: '+e.message;render(true)});
 previewTimeout=setTimeout(()=>{previewTimeout=null;stopMusic()},4000);
 musicStatus='🔊 تجربة صوت MP4 الأصلي لمدة 4 ثوانٍ';
 render(true);
}
function settingsModal(){
 return `<div class="music-overlay" role="dialog" aria-modal="true" aria-label="إعداد الموسيقى"><div class="music-modal">
 <h2>🎵 صوت MP4 فقط | تحدّي الغذاء الذكي</h2>
 <div class="music-current">✅ استخدمنا المسار الصوتي الأصلي بصيغة MP4 مباشرة، دون مسار فيديو.<br><small>لا يوتيوب، لا إعلانات، لا صورة فيديو، ولا حاجة لاختيار الملف مرة أخرى.</small></div>
 <div class="row"><button class="btn gold" data-action="preview-music">▶ تجربة الموسيقى 4 ثوانٍ</button><button class="btn pale" data-action="stop-music">⏹ إيقاف الموسيقى</button></div>
 <div><label>🔊 مستوى الصوت <strong>${Math.round(musicVolume*100)}%</strong></label><input type="range" min="0" max="100" step="5" value="${Math.round(musicVolume*100)}" id="musicVolume"></div>
 <div class="row"><button class="btn ${musicEnabled?'pale':'danger'}" data-action="toggle-music">${musicEnabled?'🔊 الموسيقى مفعّلة':'🔇 الموسيقى متوقفة'}</button></div>
 <p class="board-live-note">يبدأ الصوت مع ظهور السؤال لمدة 20 ثانية فقط، ويتوقف عند كشف الإجابة والتتويج. لا يُشغَّل أي صوت على جوالات المشاركات.</p>
 <p class="board-live-note">${ESC(musicStatus)}</p>
 <button class="btn" data-action="close-settings">العودة إلى السبورة ✓</button>
 </div></div>`;
}

function boardTools(s){
 if(s==='ready'||s==='question')return '';
 const inLobby=s==='lobby',inReveal=s==='reveal',last=index()===Q.length-1;
 const button=inLobby?'<button class="btn control-main" data-action="next">🚀 ابدئي السؤال الأول</button>'
   :inReveal?(last?'<button class="btn gold control-main" data-action="final">🏆 التتويج النهائي</button>':`<button class="btn control-main" data-action="next">🚀 استعداد السؤال ${index()+2}</button>`)
   :s==='final'?'<button class="btn gold control-main" data-action="reset">🆕 مسابقة جديدة</button>':'';
 return `<div class="screen-tools">${button}<button class="tool-icon" data-action="settings">🎵 ${musicEnabled?'الصوت جاهز ✓':'الموسيقى متوقفة'}</button><button class="tool-icon" data-action="fullscreen">⛶ الشاشة كاملة</button><button class="tool-icon reset-all" data-action="reset" title="حذف أسماء المشاركات وإجاباتهن وبدء مسابقة جديدة">🗑️ تصفير المشاركات</button></div>`;
}
function screen(){
 const s=stage();
 const tag=s==='lobby'?'المشاركات المسجّلات':s==='ready'?'الاستعداد':s==='question'?`سؤال ${index()+1} / ${Q.length}`:s==='reveal'?`كشف الإجابة ${index()+1}`:'التتويج النهائي';
 const body=s==='lobby'?lobby():s==='ready'?ready():s==='question'?questionBody(index()):s==='reveal'?revealSlide():finale();
 return frame('شاشة السبورة',tag,boardTools(s)+body+(musicOpen?settingsModal():''));
}
function render(force=false){
 const s=stage(), dynamic=(s==='lobby'||s==='reveal'||s==='final');
 const key=[view,s,index(),joinType,musicOpen,musicEnabled,musicVolume,
    view==='teacher'?me+'|'+Boolean(validAnswer(index(),me))+'|'+Boolean(state.classes?.[me]):'',
    dynamic?JSON.stringify([state.classes,state.answers]):''
 ].join('|');
 if(!force&&key===renderKey)return;
 renderKey=key;
 const root=$('#view');
 root.classList.toggle('board-view',view==='screen');
 root.innerHTML=view==='teacher'?teacher():view==='screen'?screen():welcome();
 requestAnimationFrame(()=>{fit();drawClock()});
}
function fit(){document.querySelectorAll('.question-text,.choice .label').forEach(el=>{el.style.fontSize='';let p=el.closest('.question,.choice');let fs=parseFloat(getComputedStyle(el).fontSize);while(fs>23&&(el.scrollHeight>p.clientHeight-14||el.scrollWidth>p.clientWidth-28)){fs--;el.style.fontSize=fs+'px'}})}
function drawClock(){let svg=$('#timerSvg'),path=$('#timerPath'),lab=$('#clockNum');if(!svg||!path||!lab)return;let s=stage();if(s!=='question')return;let w=svg.clientWidth,h=svg.clientHeight;if(w<20||h<20)return;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);let pad=5,r=24,x=pad,y=pad,W=w-2*pad,H=h-2*pad;path.setAttribute('d',`M ${x+r} ${y} H ${x+W-r} Q ${x+W} ${y} ${x+W} ${y+r} V ${y+H-r} Q ${x+W} ${y+H} ${x+W-r} ${y+H} H ${x+r} Q ${x} ${y+H} ${x} ${y+H-r} V ${y+r} Q ${x} ${y} ${x+r} ${y}`);let L=path.getTotalLength(),rem=Math.max(0,deadline()-Date.now())/QUESTION_MS;path.style.strokeDasharray=`${L*rem} ${L}`;let sec=remaining('question');lab.textContent='⏱️ '+sec+' ث';lab.classList.toggle('urgent',sec<=5)}
async function join(e){
 e.preventDefault();
 const input=$('#classInput');
 const raw=normalizeName(input?.value||'');
 if((joinType==='class'||joinType==='teacher')&&!raw)return;
 let name='',id='',role=joinType;
 if(role==='principal'){
   name='👑 المديرة'+(raw?' · '+raw:'');id='principal';
 }else if(role==='vice'){
   name='🎓 النائبة الأكاديمية'+(raw?' · '+raw:'');id='academic_vice';
 }else if(role==='teacher'){
   name='👩‍🏫 '+raw;id=classId('teacher:'+raw);
 }else{
   name=raw;id=classId(raw);
 }
 busy=true;
 try{
   if(!state.classes?.[id])await write('classes/'+id,{name,role});
   me=id;sessionStorage.setItem(CLASSKEY,id);sessionStorage.setItem(SESSIONKEY,String(state.sessionKey||'legacy'));draft='';render(true);
 }catch(err){alert('لم ينجح التسجيل: '+err.message)}
 finally{busy=false}
}
async function answer(n){if(busy||stage()!=='question'||!me||validAnswer(index(),me))return;busy=true;document.querySelectorAll('[data-action="answer"]').forEach(b=>b.disabled=true);try{await write(`answers/${index()}/${me}`,{choice:n,at:serverStamp()},true);render(true)}catch(err){alert('تعذر تسجيل الإجابة: '+err.message);render(true)}finally{busy=false}}
async function nextRound(){
 if(busy)return;
 const s=stage(),i=s==='lobby'?0:index()+1;
 if(!(s==='lobby'||s==='reveal')||i>=Q.length)return;
 armMusic(i);busy=true;
 try{
   await write('rounds/'+i,{startedAt:serverStamp()});
   await write('live',{phase:'round',index:i});
   render(true);
 }catch(err){alert('تعذر بدء السؤال: '+err.message)}finally{busy=false}
}
async function final(){
 if(busy||stage()!=='reveal'||index()!==Q.length-1)return;
 busy=true;
 try{await write('live',{phase:'final',index:Q.length-1});render(true)}
 catch(err){alert('تعذّر عرض التتويج النهائي: '+err.message)}
 finally{busy=false}
}
async function reset(){
 if(busy)return;
 if(!confirm('سيتم حذف جميع المشاركات المسجلات وكل الإجابات والنتائج، والعودة إلى شاشة البداية.\nستحتاج كل مشاركة إلى إدخال اسمها من جديد.\nهل تريدين متابعة تصفير المشاركات؟'))return;
 busy=true;
 stopMusic();
 try{
  const sessionKey='s'+Date.now()+'_'+Math.random().toString(36).slice(2,10);
  await updateRoot({live:{phase:'lobby',index:-1},classes:null,rounds:null,answers:null,sessionKey});
  me=''; draft=''; sessionStorage.removeItem(CLASSKEY);sessionStorage.setItem(SESSIONKEY,sessionKey);
  render(true);
 }catch(err){alert('تعذّر تصفير المشاركات: '+err.message)}finally{busy=false}
}
document.addEventListener('submit',e=>{if(e.target.id==='joinForm')join(e)});
document.addEventListener('input',e=>{
 if(e.target.id==='classInput')draft=e.target.value;
 if(e.target.id==='musicVolume'){
  musicVolume=Number(e.target.value)/100;
  localStorage.setItem('foodQuestionSoundVolume',String(musicVolume));
  musicPlayer.volume=musicActiveRound>=0||previewTimeout?musicVolume:0;
  const label=e.target.previousElementSibling?.querySelector('strong');
  if(label)label.textContent=Math.round(musicVolume*100)+'%';
 }
});
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b)return;
 const action=b.dataset.action;
 if(action==='view')setView(b.dataset.to);
 else if(action==='role'){joinType=b.dataset.role;draft='';render(true)}
 else if(action==='fill'){draft=b.dataset.name;let el=$('#classInput');if(el){el.value=draft;el.focus()}}
 else if(action==='answer')answer(Number(b.dataset.choice));
 else if(action==='settings'){musicOpen=true;render(true)}
 else if(action==='close-settings'){musicOpen=false;stopMusic();render(true)}
 else if(action==='preview-music')previewMusic();
 else if(action==='stop-music'){stopMusic();musicStatus='تم إيقاف تجربة الصوت';render(true)}
 else if(action==='toggle-music'){
  musicEnabled=!musicEnabled;
  localStorage.setItem('foodQuestionSoundEnabled',String(musicEnabled));
  if(!musicEnabled)stopMusic();
  render(true);
 }
 else if(action==='next')nextRound();
 else if(action==='final')final();
 else if(action==='reset')reset();
 else if(action==='fullscreen'){
  if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});
  else document.exitFullscreen?.().catch(()=>{});
 }
 else if(action==='copy'){
  const input=document.getElementById(b.dataset.target);
  navigator.clipboard?.writeText(input?.value||'').then(()=>b.textContent='تم النسخ ✓')
   .catch(()=>prompt('انسخي الرابط',input?.value||''));
 }
});

let lastStage='';setInterval(()=>{let s=stage();tickMusic();if(s!==lastStage){lastStage=s;render(true)}if(s==='ready'){let el=$('#readyNum');if(el)el.textContent=remaining('ready')}if(s==='question')drawClock();if(view==='host'&&(s==='ready'||s==='question')){let el=$('.pill-text');if(el)el.textContent=s==='ready'?'استعداد '+remaining('ready')+' ث':'متبقّي '+remaining('question')+' ث'}},90);
window.addEventListener('resize',()=>{requestAnimationFrame(()=>{fit();drawClock()})});document.fonts?.ready.then(()=>requestAnimationFrame(fit));
if(REMOTE){sync();setInterval(sync,1000)}else{state=localRead();syncParticipantSession();window.addEventListener('storage',e=>{if(e.key===KEY){state=localRead();syncParticipantSession();render()}})}
if(view==='host')view='screen';if(!['welcome','teacher','screen'].includes(view))view='welcome';render(true);
</script>
</body>
